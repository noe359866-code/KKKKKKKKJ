# JVM for the Gradle daemon. Android Studio suggests 2-4 GB for Compose builds.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# AndroidX is mandatory for Compose / Media3.
android.useAndroidX=true
android.nonTransitiveRClass=true
# R8 en modo completo: mejor reducción (APK más pequeño) y ofuscación real.
android.enableR8.fullMode=true

# Kotlin
kotlin.code.style=official

# --- Backend opcional ------------------------------------------------------
# El modo predeterminado es autónomo. No hace falta definir ninguna URL.
# Sólo para quien seleccione "Servidor externo" en Ajustes:
#addonBaseUrl=http://192.168.1.50:7000
#releaseAddonBaseUrl=https://addon.tu-dominio.com
