# JVM for the Gradle daemon. Android Studio suggests 2-4 GB for Compose builds.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX is mandatory for Compose / Media3.
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# --- Addon backend ---------------------------------------------------------
# Base URL the app talks to. Override per machine in local.properties or with
#   ./gradlew :app:assembleDebug -PaddonBaseUrl=http://192.168.1.50:7000
# 10.0.2.2 is the host loopback as seen from the Android emulator.
addonBaseUrl=http://10.0.2.2:7000
