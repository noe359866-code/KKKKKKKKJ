# JVM for the Gradle daemon. Android Studio suggests 2-4 GB for Compose builds.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# AndroidX is mandatory for Compose / Media3.
android.useAndroidX=true
android.nonTransitiveRClass=true
# R8 en modo completo: mejor reducción (APK más pequeño) y ofuscación real.
android.enableR8.fullMode=true

# Kotlin
kotlin.code.style=official

# --- Addon backend ---------------------------------------------------------
# URL por defecto del build DEBUG. 10.0.2.2 es el host visto desde el emulador.
#   ./gradlew :app:assembleDebug -PaddonBaseUrl=http://192.168.1.50:7000
addonBaseUrl=http://10.0.2.2:7000
#
# URL del build RELEASE: no tiene valor por defecto a propósito (un release que
# apunte al loopback del emulador no sirve en ninguna TV). Se pasa al compilar:
#   ./gradlew :app:assembleRelease -PreleaseAddonBaseUrl=https://addon.tu-dominio.com
# o con la variable de entorno ADDON_BASE_URL. Sin ella, `assembleRelease` falla
# con instrucciones antes de empaquetar nada.
#releaseAddonBaseUrl=https://addon.tu-dominio.com
