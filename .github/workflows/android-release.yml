name: Android release

# Compila el APK/AAB de producción en un runner con JDK 17 + Android SDK.
#
# Disparadores:
#   - manual (workflow_dispatch): URL del backend opcional;
#   - tag v*: usa la variable de repositorio PRODUCTION_ADDON_BASE_URL.
#
# Si no hay URL, el APK se compila con la URL vacía a propósito: la app abre el
# diálogo "Servidor del addon" en el primer arranque (nunca una IP de emulador ni
# contenido de prueba). Con URL, esa URL queda como valor por defecto.
#
# Firma:
#   - si existe el secreto RELEASE_KEYSTORE_BASE64 se usa esa clave (la buena
#     para publicar actualizaciones);
#   - si no, se genera una clave *sideload* efímera y se publica como artefacto
#     para que puedas guardarla y firmar las próximas versiones igual.

on:
  workflow_dispatch:
    inputs:
      addon_base_url:
        description: "URL pública del backend Node (vacío = pedirla en la app)"
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  # Sólo para publicar el diagnóstico del build como check-run (ver más abajo).
  checks: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # Input manual primero; si el disparador es un tag, la variable del repo.
      ADDON_BASE_URL: ${{ inputs.addon_base_url || vars.PRODUCTION_ADDON_BASE_URL }}
      KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      SECRET_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      SECRET_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      SECRET_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # El runner de ubuntu-latest ya trae el SDK de Android; sólo hay que
      # aceptar licencias y asegurar la plataforma que pide el build. Se evita
      # depender de una action externa (y de su cadencia de releases).
      - name: Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error::El runner no tiene Android SDK (ANDROID_HOME vacío)."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          ls "$SDK/platforms" 2>/dev/null || true
          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ]; then
            SDKMGR="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)"
          fi
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" "platforms;android-36" "build-tools;35.0.0" 2>&1 | tail -3 || true
          else
            echo "sdkmanager no disponible; se confía en la descarga automática de AGP."
          fi
          ls "$SDK/platforms"

      - name: Resolver URL del backend
        id: url
        run: |
          if [ -z "${ADDON_BASE_URL:-}" ]; then
            echo "Sin URL: el APK se compilará con la URL vacía y la pedirá al arrancar."
            echo "ALLOW_EMPTY_ADDON_BASE_URL=true" >> "$GITHUB_ENV"
            echo "value=(preguntar en la app)" >> "$GITHUB_OUTPUT"
          else
            echo "Backend: $ADDON_BASE_URL"
            echo "value=$ADDON_BASE_URL" >> "$GITHUB_OUTPUT"
          fi

      # Sin secreto de keystore se genera una clave de sideload. Viaja como
      # artefacto para que puedas guardarla: sin ella, la siguiente versión no
      # se instala *encima* de esta (Android exige la misma firma).
      - name: Preparar firma
        id: signing
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/release.keystore"
            {
              echo "RELEASE_STORE_FILE=${RUNNER_TEMP}/release.keystore"
              echo "RELEASE_STORE_PASSWORD=${SECRET_STORE_PASSWORD}"
              echo "RELEASE_KEY_ALIAS=${SECRET_KEY_ALIAS}"
              echo "RELEASE_KEY_PASSWORD=${SECRET_KEY_PASSWORD}"
            } >> "$GITHUB_ENV"
            echo "kind=secreto" >> "$GITHUB_OUTPUT"
            echo "Firmando con el keystore del repositorio (secreto)."
          else
            SIDELOAD_PASS="streamflix-sideload"
            keytool -genkeypair -noprompt \
              -keystore "${RUNNER_TEMP}/sideload.keystore" \
              -storetype PKCS12 \
              -alias streamflix \
              -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass "$SIDELOAD_PASS" -keypass "$SIDELOAD_PASS" \
              -dname "CN=Streamflix Sideload, OU=Android, O=Streamflix, C=NI"
            {
              echo "RELEASE_STORE_FILE=${RUNNER_TEMP}/sideload.keystore"
              echo "RELEASE_STORE_PASSWORD=${SIDELOAD_PASS}"
              echo "RELEASE_KEY_ALIAS=streamflix"
              echo "RELEASE_KEY_PASSWORD=${SIDELOAD_PASS}"
            } >> "$GITHUB_ENV"
            echo "kind=sideload" >> "$GITHUB_OUTPUT"
            echo "Firmando con una clave sideload nueva (sin secretos de firma)."
          fi

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee -a "$RUNNER_TEMP/ci.log"

      - name: Lint (release)
        run: |
          set -o pipefail
          ./gradlew :app:lintRelease --no-daemon --stacktrace 2>&1 | tee -a "$RUNNER_TEMP/ci.log"

      - name: Build release APK + AAB
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace 2>&1 | tee -a "$RUNNER_TEMP/ci.log"

      - name: Verificar versión, firma y digests de la APK
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          AAB=$(ls app/build/outputs/bundle/release/*.aab | head -1)
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          BADGING=$("$AAPT" dump badging "$APK")
          printf '%s\n' "$BADGING" | grep '^package:'
          printf '%s\n' "$BADGING" | grep -F "versionName='0.9.9'" | grep -F "versionCode='2'"
          VERSIONED_APK="$(dirname "$APK")/streamflix-0.9.9.apk"
          mv "$APK" "$VERSIONED_APK"
          APK="$VERSIONED_APK"
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "AAB=$AAB" >> "$GITHUB_ENV"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"
          sha256sum "$APK" "$AAB" | tee digests.txt

      - name: Resumen
        run: |
          {
            echo "## Build de release"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Versión | \`0.9.9 (código interno 2)\` |"
            echo "| Backend por defecto | \`${{ steps.url.outputs.value }}\` |"
            echo "| Firma | \`${{ steps.signing.outputs.kind }}\` |"
            echo "| APK | \`$(basename "$APK")\` ($(du -h "$APK" | cut -f1)) |"
            echo "| AAB | \`$(basename "$AAB")\` ($(du -h "$AAB" | cut -f1)) |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo ""
            echo "### SHA-256"
            echo '```'
            cat digests.txt
            echo '```'
            echo ""
            echo "### Instalar"
            echo '```bash'
            echo "adb install -r $(basename "$APK")"
            echo "# TV: adb connect <ip-del-box>:5555 && adb install -r $(basename "$APK")"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Cuando algo falla, las últimas líneas se publican como anotaciones del
      # check-run: se leen por API (api.github.com) sin descargar el zip de logs.
      - name: Diagnóstico
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/ci.log"
          if [ ! -s "$LOG" ]; then
            echo "::error title=sin-log::El build falló antes de ejecutar Gradle."
            exit 0
          fi
          tail -n 8 "$LOG" | while IFS= read -r line; do
            clean=$(printf '%s' "$line" | tr -d '\r' | cut -c1-900)
            [ -n "$clean" ] && echo "::error title=gradle::$clean"
          done

      # Un check-run aparte con las líneas relevantes: el endpoint de logs
      # devuelve un zip en un host de almacenamiento, pero el texto de un
      # check-run se lee por api.github.com.
      - name: Publicar diagnóstico completo
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const file = `${process.env.RUNNER_TEMP}/ci.log`;
            const raw = fs.existsSync(file) ? fs.readFileSync(file, 'utf8') : '(sin ci.log)';
            const lines = raw.split('\n');
            const interesting = lines.filter((l) =>
              /FAILED|AssertionError|expected:|Unresolved|^e: |Execution failed|error:/i.test(l));
            const body = [
              '### Líneas con error',
              '```',
              (interesting.slice(-140).join('\n') || '(ninguna)'),
              '```',
              '### Final del log',
              '```',
              lines.slice(-140).join('\n'),
              '```',
            ].join('\n').slice(-60000);
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'diagnostico-build',
              head_sha: context.sha,
              status: 'completed',
              conclusion: 'neutral',
              output: {
                title: 'Falló el build de release',
                summary: 'Últimas líneas del log de Gradle.',
                text: body || '(vacío)',
              },
            });

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: streamflix-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: streamflix-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 90

      # Sólo existe en el modo sideload. Guárdala si quieres instalar la próxima
      # versión encima de esta sin desinstalar; caduca a los 30 días.
      - name: Upload keystore de sideload
        if: steps.signing.outputs.kind == 'sideload'
        uses: actions/upload-artifact@v4
        with:
          name: sideload-keystore
          path: ${{ runner.temp }}/sideload.keystore
          if-no-files-found: warn
          retention-days: 30
